
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Login Signup</title>
    <link rel="stylesheet" href="loginandsignup.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">Nova<span>Mart.</span></a>

        <nav>
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../about/aboutus.html">About Us</a></li>
                <li><a href="../products/products.html">Products</a></li>
                <li><a href="../contact/contact.html">Contact</a></li>
            </ul>
        </nav>

        <div class="nav-buttons">
            <a href="loginandsignup.html" class="login-btn">Login</a>
            <a href="loginandsignup.html" class="signup-btn">Sign up</a>
        </div>
    </header>
<div class="container">

    <h2>Welcome to Our Website</h2>

    <input type="checkbox" id="toggle">

    <div class="card">

        <!-- LOGIN PAGE -->
        <div class="screen login-screen">

            <div class="form">
                <h3>Sign In</h3>

                <input type="email" placeholder="Email Address">
                <input type="password" placeholder="Password">

                <a href="#">Forgot Password?</a>

                <button type="button">Sign In</button>

                <p>
                    Don't have an account?
                    <label for="toggle" class="switch-link">
                        Sign Up
                    </label>
                </p>
            </div>

            <div class="welcome">
                <h1>Welcome<br>Back!</h1>
                <p>We're happy to see you again.</p>
            </div>

        </div>


        <!-- SIGNUP PAGE -->
        <div class="screen signup-screen">

            <div class="welcome">
                <h1>Hello,<br>Friend!</h1>
                <p>Create your account and join our community.</p>
            </div>

            <div class="form">
                <h3>Create Account</h3>

                <input type="text" placeholder="Full Name">
                <input type="email" placeholder="Email Address">
                <input type="password" placeholder="Password">

                <button type="button">Sign Up</button>

                <p>
                    Already have an account?
                    <label for="toggle" class="switch-link">
                        Sign In
                    </label>
                </p>
            </div>

        </div>

    </div>
</div>

</body>
</html>
